<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nghệ sĩ · Artdict Admin</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/admin.css" />
  
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-JLCS1K8P58"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-JLCS1K8P58');
    </script>
</head>
  <body>
    <div class="admin-shell">
      <aside class="sidebar" id="admin-nav"></aside>
      <main class="main">
        <div class="main__head"><h1>Nghệ sĩ</h1></div>
        <div id="msg" class="msg"></div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>#</th><th>Tên</th><th>Slug</th><th>Vai trò</th><th>Thành phố</th><th></th></tr>
            </thead>
            <tbody id="artists-body">
              <tr><td colspan="6" class="muted">Đang tải…</td></tr>
            </tbody>
          </table>
        </div>

        <div class="section-gap">
          <h2 id="artist-form-title">Thêm nghệ sĩ mới</h2>
          <form id="artist-form" class="card form-grid">
            <div class="field"><label for="name">Tên nghệ sĩ</label><input id="name" /></div>
            <div class="field"><label for="slug">Slug</label><input id="slug" placeholder="nguyen-muc-tau" /></div>
            <div class="field"><label for="role">Vai trò</label><input id="role" placeholder="Họa sĩ minh họa" /></div>
            <div class="field"><label for="city">Thành phố</label><input id="city" /></div>
            <div class="field"><label for="since">Hoạt động từ năm</label><input id="since" type="number" placeholder="2019" /></div>
            <div class="field">
              <label for="avatarUrl">Ảnh chân dung</label>
              <input id="avatarUrl" placeholder="Dán URL, hoặc chọn ảnh từ máy bên dưới" />
              <input id="avatarFile" type="file" accept="image/*" style="margin-top: 6px; width: auto" />
              <small class="muted">Chọn ảnh từ máy sẽ upload và ghi đè URL ở trên.</small>
            </div>
            <div class="field"><label for="quote">Pull quote lớn</label><textarea id="quote"></textarea></div>

            <fieldset class="fieldset">
              <legend>Câu hỏi 1</legend>
              <div class="field"><label for="q1">Tiêu đề</label><input id="q1" /></div>
              <div class="field"><label for="a1">Nội dung (dùng dòng trống để xuống đoạn)</label><textarea id="a1"></textarea></div>
            </fieldset>
            <fieldset class="fieldset">
              <legend>Câu hỏi 2</legend>
              <div class="field"><label for="q2">Tiêu đề</label><input id="q2" /></div>
              <div class="field"><label for="a2">Nội dung</label><textarea id="a2"></textarea></div>
            </fieldset>
            <fieldset class="fieldset">
              <legend>Câu hỏi 3</legend>
              <div class="field"><label for="q3">Tiêu đề</label><input id="q3" /></div>
              <div class="field"><label for="a3">Nội dung</label><textarea id="a3"></textarea></div>
            </fieldset>

            <div class="form-actions">
              <button class="btn" type="submit" id="artist-submit">Tạo nghệ sĩ</button>
              <button class="btn btn--ghost" type="button" id="artist-cancel" hidden>Hủy</button>
            </div>
          </form>
        </div>
      </main>
    </div>

    <script src="js/core.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/artists.js"></script>
  </body>
</html>
