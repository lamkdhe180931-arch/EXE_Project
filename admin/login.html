<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập · Artdict Admin</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/admin.css" />
  
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-JLCS1K8P58"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-JLCS1K8P58');
    </script>
</head>
  <body>
    <div class="login-wrap">
      <div class="card login-card">
        <h1>Art<span style="color: var(--crimson)">dict.</span> Admin</h1>
        <p class="muted">Đăng nhập bằng tài khoản quản trị.</p>
        <div id="msg" class="msg msg--error"></div>
        <form id="login-form" class="form-grid">
          <div class="field">
            <label for="email">Email</label>
            <input id="email" type="email" autocomplete="username" required />
          </div>
          <div class="field">
            <label for="password">Mật khẩu</label>
            <input id="password" type="password" autocomplete="current-password" required />
          </div>
          <button class="btn" type="submit">Đăng nhập</button>
        </form>
      </div>
    </div>

    <script src="js/core.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/login.js"></script>
  </body>
</html>
