<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sản phẩm · Artdict Admin</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/admin.css" />
  </head>
  <body>
    <div class="admin-shell">
      <aside class="sidebar" id="admin-nav"></aside>
      <main class="main">
        <div class="main__head"><h1>Sản phẩm</h1></div>
        <div id="msg" class="msg"></div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>#</th><th>Tên</th><th>Giá</th><th>Tồn</th><th>Danh mục</th><th>Nghệ sĩ</th><th></th></tr>
            </thead>
            <tbody id="products-body">
              <tr><td colspan="7" class="muted">Đang tải…</td></tr>
            </tbody>
          </table>
        </div>

        <div class="section-gap">
          <h2>Thêm sản phẩm mới</h2>
          <form id="product-form" class="card form-grid">
            <div class="field"><label for="name">Tên</label><input id="name" required /></div>
            <div class="field"><label for="slug">Slug</label><input id="slug" placeholder="ao-meo-no" required /></div>
            <div class="field"><label for="price">Giá (VND)</label><input id="price" type="number" min="0" required /></div>
            <div class="field"><label for="stock">Tồn kho</label><input id="stock" type="number" min="0" value="0" /></div>
            <div class="field"><label for="category">Danh mục</label><input id="category" placeholder="ao / mu / so-tay" required /></div>
            <div class="field">
              <label for="artistId">Nghệ sĩ</label>
              <select id="artistId"><option value="">— Không gán —</option></select>
            </div>
            <div class="field">
              <label for="images">Hình ảnh (có thể chọn nhiều)</label>
              <input id="images" type="file" accept="image/*" multiple />
            </div>
            <button class="btn" type="submit">Tạo sản phẩm</button>
          </form>
        </div>
      </main>
    </div>

    <script src="js/core.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/products.js"></script>
  </body>
</html>
