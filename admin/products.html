<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sản phẩm · Artdict Admin</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/admin.css" />
  
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-G7TTFHPV8P"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-G7TTFHPV8P');
    </script>
</head>
  <body>
    <div class="admin-shell">
      <aside class="sidebar" id="admin-nav"></aside>
      <main class="main">
        <div class="main__head"><h1>Sản phẩm</h1></div>
        <div id="msg" class="msg"></div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>#</th><th>Tên</th><th>Giá</th><th>Tồn</th><th>Danh mục</th><th>Nghệ sĩ</th><th></th></tr>
            </thead>
            <tbody id="products-body">
              <tr><td colspan="7" class="muted">Đang tải…</td></tr>
            </tbody>
          </table>
        </div>

        <div class="section-gap">
          <h2 id="product-form-title">Thêm sản phẩm mới</h2>
          <form id="product-form" class="card form-grid">
            <div class="field"><label for="name">Tên</label><input id="name" /></div>
            <div class="field"><label for="slug">Slug</label><input id="slug" placeholder="ao-meo-no" /></div>
            <div class="field"><label for="price">Giá (VND)</label><input id="price" type="number" min="0" /></div>
            <div class="field"><label for="stock">Tồn kho</label><input id="stock" type="number" min="0" value="0" /></div>
            <div class="field">
              <label for="category">Danh mục</label>
              <select id="category">
                <option value="">— Chọn danh mục —</option>
                <option value="aothun">Áo thun</option>
                <option value="mu">Mũ</option>
                <option value="vongtay">Vòng tay</option>
                <option value="sotay">Sổ tay</option>
                <option value="nhandan">Nhãn dán</option>
                <option value="mockhoa">Móc khóa</option>
                <option value="tranh">Tranh</option>
                <option value="khac">Khác</option>
              </select>
            </div>
            <div class="field">
              <label for="artistId">Nghệ sĩ</label>
              <select id="artistId"><option value="">— Không gán —</option></select>
            </div>
            <div class="field">
              <label for="description">Mô tả (hiện ở trang chi tiết)</label>
              <textarea id="description" rows="3" placeholder="Bản in thủ công, chất liệu, cảm hứng…"></textarea>
            </div>
            <div class="field">
              <label for="images">Hình ảnh (có thể chọn nhiều)</label>
              <input id="images" type="file" accept="image/*" multiple />
            </div>
            <div class="form-actions">
              <button class="btn" type="submit" id="product-submit">Tạo sản phẩm</button>
              <button class="btn btn--ghost" type="button" id="product-cancel" hidden>Hủy</button>
            </div>
          </form>
        </div>
      </main>
    </div>

    <script src="js/core.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/products.js"></script>
  </body>
</html>
