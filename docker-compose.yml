services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: artdict
      POSTGRES_PASSWORD: artdict_password
      POSTGRES_DB: artdict_db
    ports:
      - "5432:5432"
    volumes:
      - artdict_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artdict -d artdict_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://artdict:artdict_password@postgres:5432/artdict_db?schema=public
      ADMIN_EMAIL: admin@artdict.local
      ADMIN_PASSWORD: ChangeMe123!
      SESSION_SECRET: local-development-session-secret-change-me
      NODE_ENV: production
    ports:
      - "3000:3000"

volumes:
  artdict_postgres:
