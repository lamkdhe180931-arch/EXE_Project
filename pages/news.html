<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>News — Artdict</title>
    <link rel="stylesheet" href="/css/style.css" />
  
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-JLCS1K8P58"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-JLCS1K8P58');
    </script>
</head>
  <body>
    <site-header active="khampha"></site-header>

    <main class="wrap">
      <!-- HERO -->
      <section class="post-hero reveal">
        <p class="eyebrow">News · Từ xưởng</p>
        <h1>Chuyện <em>đang</em> diễn ra.</h1>
        <p class="post-hero__lede">
          Bản in mới, sự kiện, hậu trường và những gì Artdict đang làm. Tin
          ngắn, cập nhật thường xuyên.
        </p>
      </section>

      <!-- LIST — rendered from GET /api/posts?type=NEWS by /js/posts.js -->
      <section class="post-list" id="post-list" data-type="NEWS">
        <p
          style="
            padding: 34px 0;
            color: color-mix(in srgb, var(--ink) 60%, transparent);
          "
        >
          Đang tải tin tức…
        </p>
      </section>
    </main>

    <site-footer></site-footer>

    <!-- CART DRAWER -->
    <div class="cart-scrim" data-cart-scrim></div>
    <aside class="cart-drawer" data-cart-drawer aria-label="Giỏ hàng">
      <div class="cart-drawer__head">
        <span class="cart-drawer__title">Giỏ hàng</span>
        <button class="cart-close" data-close-cart aria-label="Đóng">✕</button>
      </div>
      <div class="cart-items" data-cart-items></div>
      <div class="cart-drawer__foot">
        <div class="cart-total">
          <span class="cart-total__label">Tạm tính</span>
          <span class="cart-total__val" data-cart-total>0₫</span>
        </div>
        <button class="circle-btn circle-btn--solid circle-btn--block">
          Thanh toán
        </button>
      </div>
    </aside>

    <script src="/components/site-header.js" defer></script>
    <script src="/components/site-footer.js" defer></script>
    <script src="/js/api.js" defer></script>
    <script src="/js/posts.js" defer></script>
    <script src="/js/artdict.js" defer></script>
  </body>
</html>
