<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bộ sưu tập — Artdict</title>
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
    <link rel="stylesheet" href="/css/style.css" />
    <style>
      /* page-local */
      .cat-hero {
        padding: calc(120px + 40px) 0 40px;
      }

      .cat-hero__grid {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: end;
        gap: 40px;
      }

      .cat-hero__lede {
        max-width: 30ch;
        font-size: 1.05rem;
        color: color-mix(in srgb, var(--ink) 72%, transparent);
        text-align: right;
      }

      .cat-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        flex-wrap: wrap;
        padding: 22px 0 30px;
        border-top: 1px solid var(--line-light);
        border-bottom: 1px solid var(--line-light);
        margin-bottom: 44px;
      }

      /* .cat-count {
        font-family: var(--display);
        font-weight: 600;
        font-size: 0.92rem;
        color: color-mix(in srgb, var(--ink) 60%, transparent);
      }
      .cat-count b {
        color: var(--crimson);
      } */
      .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 24px;
      }

      @media (max-width: 1024px) {
        .grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      @media (max-width: 768px) {
        .grid {
          grid-template-columns: 1fr;
        }

        .cat-hero__grid {
          grid-template-columns: 1fr;
        }

        .cat-hero__lede {
          text-align: left;
        }
      }

      @media (max-width: 900px) {
        .cat-hero {
          padding: 40px 0 28px;
        }
      }
    </style>
  
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-JLCS1K8P58"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-JLCS1K8P58');
    </script>
</head>

  <body>
    <site-header active="catalogue"></site-header>

    <main class="wrap">
      <!-- HERO -->
      <section class="cat-hero">
        <div class="cat-hero__grid">
          <div class="reveal">
            <p class="eyebrow" style="margin-bottom: 18px">
              Bộ sưu tập · Mùa 04
            </p>
            <h1 class="display-xl">Mực &amp;<br />Giấy.</h1>
          </div>
          <p class="cat-hero__lede reveal" data-delay="120">
            Số lượng giới hạn. In thủ công tại Sài Gòn. Mỗi món đồ là một bản
            in, không tái bản — đeo, mặc và mang theo một mảnh nghệ thuật đường
            phố.
          </p>
        </div>
      </section>

      <!-- FILTER + COUNT -->
      <section class="cat-meta reveal">
        <div class="filter-bar" role="group" aria-label="Lọc theo danh mục">
          <button
            class="filter-pill is-active"
            data-filter="all"
            aria-pressed="true"
          >
            Tất cả <span class="fp-count">00</span>
          </button>

          <div class="filter-divider" aria-hidden="true"></div>

          <button class="filter-pill" data-filter="aothun" aria-pressed="false">
            Áo thun <span class="fp-count">00</span>
          </button>
          <button class="filter-pill" data-filter="mu" aria-pressed="false">
            Mũ <span class="fp-count">00</span>
          </button>
          <button
            class="filter-pill"
            data-filter="vongtay"
            aria-pressed="false"
          >
            Vòng tay <span class="fp-count">00</span>
          </button>

          <div class="filter-divider" aria-hidden="true"></div>

          <button class="filter-pill" data-filter="sotay" aria-pressed="false">
            Sổ tay <span class="fp-count">00</span>
          </button>
          <button
            class="filter-pill"
            data-filter="nhandan"
            aria-pressed="false"
          >
            Nhãn dán <span class="fp-count">00</span>
          </button>
          <button
            class="filter-pill"
            data-filter="mockhoa"
            aria-pressed="false"
          >
            Móc khóa <span class="fp-count">00</span>
          </button>
          <button class="filter-pill" data-filter="tranh" aria-pressed="false">
            Tranh <span class="fp-count">00</span>
          </button>
          <button class="filter-pill" data-filter="khac" aria-pressed="false">
            Khác <span class="fp-count">00</span>
          </button>
        </div>
        <!-- <p class="cat-count"><b data-result-count>9</b> sản phẩm</p> -->
      </section>

      <!-- GRID — rendered from GET /api/products by /js/catalogue.js -->
      <section class="grid" id="grid">
        <p
          style="
            grid-column: 1 / -1;
            padding: 40px 0;
            color: color-mix(in srgb, var(--ink) 60%, transparent);
          "
        >
          Đang tải sản phẩm…
        </p>
      </section>
    </main>

    <site-footer></site-footer>

    <!-- CART DRAWER -->
    <div class="cart-scrim" data-cart-scrim></div>
    <aside class="cart-drawer" data-cart-drawer aria-label="Giỏ hàng">
      <div class="cart-drawer__head">
        <span class="cart-drawer__title">Giỏ hàng</span>
        <button class="cart-close" data-close-cart aria-label="Đóng">✕</button>
      </div>
      <div class="cart-items" data-cart-items></div>
      <div class="cart-drawer__foot">
        <div class="cart-total">
          <span class="cart-total__label">Tạm tính</span>
          <span class="cart-total__val" data-cart-total>0₫</span>
        </div>
        <button class="circle-btn circle-btn--solid circle-btn--block">
          Thanh toán
        </button>
      </div>
    </aside>

    <script src="/components/site-header.js" defer></script>
    <script src="/components/site-footer.js" defer></script>
    <script src="/js/api.js" defer></script>
    <script src="/js/catalogue.js" defer></script>
    <script src="/js/artdict.js" defer></script>
  </body>
</html>
