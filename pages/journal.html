<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tạp chí — Artdict</title>
    <link rel="stylesheet" href="/css/style.css" />
    <style>
      .coming {
        min-height: 60vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 18px;
        padding: calc(var(--nav-h) + 40px) 0 60px;
      }
      .coming h1 {
        font-family: var(--display);
        font-weight: 700;
        letter-spacing: -0.045em;
        font-size: clamp(2rem, 5vw, 3.6rem);
      }
      .coming p {
        color: color-mix(in srgb, var(--ink) 60%, transparent);
        max-width: 36ch;
      }
    </style>
  </head>
  <body>
    <site-header active="khampha"></site-header>

    <main class="wrap">
      <section class="coming">
        <p class="eyebrow">Tạp chí</p>
        <h1>Đang xây dựng</h1>
        <p>Tạp chí Artdict sẽ ra mắt trong thời gian tới. Quay lại sau nhé.</p>
        <a class="circle-btn" href="/">Về trang chủ</a>
      </section>
    </main>

    <site-footer></site-footer>

    <script src="/components/site-header.js" defer></script>
    <script src="/components/site-footer.js" defer></script>
  </body>
</html>
