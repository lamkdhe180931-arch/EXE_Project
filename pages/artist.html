<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phỏng vấn · Artdict</title>
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
    <link rel="stylesheet" href="/css/style.css" />
    <style>
      .iv-top {
        padding: calc(120px + 24px) 0 0;
      }
      .iv-related {
        margin-top: 96px;
      }
      .iv-related__head {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 32px;
      }
      .rel-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 24px;
      }
      .iv-next {
        margin-top: 80px;
        padding: 40px 0;
        border-top: 1px solid var(--line-light);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        flex-wrap: wrap;
      }
      .iv-next__k {
        font-family: var(--display);
        font-weight: 600;
        font-size: 0.75rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: color-mix(in srgb, var(--ink) 50%, transparent);
      }
      .iv-next__name {
        font-family: var(--display);
        font-weight: 700;
        letter-spacing: -0.04em;
        font-size: clamp(1.8rem, 3.5vw, 2.6rem);
        margin-top: 4px;
      }
      .iv-next__name a:hover {
        color: var(--crimson);
      }
      @media (max-width: 900px) {
        .rel-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <site-header active="tacgia"></site-header>

    <main class="wrap iv-top">
      <nav
        class="breadcrumb reveal"
        style="
          display: flex;
          gap: 10px;
          align-items: center;
          font-family: var(--display);
          font-weight: 500;
          font-size: 0.85rem;
          color: color-mix(in srgb, var(--ink) 55%, transparent);
          margin-bottom: 32px;
        "
      >
        <a href="artists.html" style="transition: color 0.25s">Tác giả</a>
        <span style="opacity: 0.4">/</span>
        <span style="color: var(--ink)" id="iv-crumb-name">Đang tải…</span>
      </nav>

      <!-- HERO — filled from GET /api/artists by /js/artist.js -->
      <section class="iv-hero">
        <div class="iv-portrait reveal" id="iv-portrait">
          <div class="ph" style="font-weight: 400">
            <span class="ph__label">Đang tải…</span>
          </div>
        </div>
        <div class="reveal" data-delay="120">
          <p class="eyebrow" id="iv-eyebrow">artdictờ</p>
          <h1 class="iv-name" id="iv-name">Đang tải…</h1>
          <div class="iv-meta">
            <div class="iv-meta__item">
              <div class="iv-meta__k">Vai trò</div>
              <div class="iv-meta__v" id="iv-role">—</div>
            </div>
            <div class="iv-meta__item">
              <div class="iv-meta__k">Thành phố</div>
              <div class="iv-meta__v" id="iv-city">—</div>
            </div>
            <div class="iv-meta__item">
              <div class="iv-meta__k">Hoạt động</div>
              <div class="iv-meta__v" id="iv-since">—</div>
            </div>
            <div class="iv-meta__item">
              <div class="iv-meta__k">Tác phẩm</div>
              <div class="iv-meta__v" id="iv-meta-works">—</div>
            </div>
          </div>
        </div>
      </section>

      <!-- BIG PULL QUOTE -->
      <section class="iv-banner reveal">
        <p class="pull-quote">
          <span class="q-mark">“</span><span id="iv-quote"></span
          ><span class="q-mark">”</span>
        </p>
        <p class="iv-banner__by" id="iv-by">—</p>
      </section>

      <!-- INTERVIEW BODY -->
      <section class="iv-body">
        <aside class="iv-toc reveal">
          <p class="iv-toc__title">Nội dung</p>
          <ul id="iv-toc-list"></ul>
        </aside>

        <div class="iv-qas" id="iv-qas"></div>
      </section>

      <!-- ARTIST'S WORKS -->
      <section class="iv-related" id="iv-related">
        <div class="iv-related__head reveal">
          <div>
            <p class="eyebrow" id="iv-works-title">Tác phẩm</p>
            <h2
              class="section-title"
              style="font-size: clamp(1.8rem, 3.5vw, 2.8rem); margin-top: 10px"
            >
              Mua một bản in.
            </h2>
          </div>
          <a class="circle-btn" href="catalogue.html">Xem bộ sưu tập</a>
        </div>
        <div class="rel-grid" id="iv-works-grid"></div>
      </section>

      <!-- NEXT ARTIST -->
      <section class="iv-next reveal" id="iv-next">
        <div>
          <div class="iv-next__k" id="iv-next-k">artdictờ tiếp theo</div>
          <div class="iv-next__name">
            <a href="artists.html" id="iv-next-link">Tất cả tác giả →</a>
          </div>
        </div>
        <a class="circle-btn" href="artists.html">Tất cả tác giả</a>
      </section>
    </main>

    <site-footer></site-footer>

    <!-- CART DRAWER -->
    <div class="cart-scrim" data-cart-scrim></div>
    <aside class="cart-drawer" data-cart-drawer aria-label="Giỏ hàng">
      <div class="cart-drawer__head">
        <span class="cart-drawer__title">Giỏ hàng</span>
        <button class="cart-close" data-close-cart aria-label="Đóng">✕</button>
      </div>
      <div class="cart-items" data-cart-items></div>
      <div class="cart-drawer__foot">
        <div class="cart-total">
          <span class="cart-total__label">Tạm tính</span>
          <span class="cart-total__val" data-cart-total>0₫</span>
        </div>
        <button class="circle-btn circle-btn--solid circle-btn--block">
          Thanh toán
        </button>
      </div>
    </aside>

    <script src="/components/site-header.js" defer></script>
    <script src="/components/site-footer.js" defer></script>
    <script src="/js/api.js" defer></script>
    <script src="/js/artist.js" defer></script>
    <script src="/js/artdict.js" defer></script>
  </body>
</html>
