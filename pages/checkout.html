<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thanh toán — Artdict</title>
    <link rel="stylesheet" href="/css/style.css" />
    <style>
      /* ============ CHECKOUT — page-local ============ */
      .co {
        padding: calc(var(--nav-h) + 28px) 0 0;
      }
      .co-head {
        max-width: 32ch;
        margin-bottom: clamp(28px, 4vw, 44px);
      }
      .co-title {
        font-family: var(--display);
        font-weight: var(--fw-bold);
        font-size: var(--fs-display-md);
        letter-spacing: var(--ls-display-md);
        line-height: var(--lh-tightest);
        margin-top: 16px;
      }

      .co-grid {
        display: grid;
        grid-template-columns: 1.15fr 0.85fr;
        gap: clamp(32px, 5vw, 72px);
        align-items: start;
        padding-bottom: 110px;
      }

      /* FORM */
      .co-form__h,
      .co-sum__h {
        font-family: var(--display);
        font-weight: var(--fw-bold);
        font-size: var(--fs-h2);
        letter-spacing: var(--ls-display-sm);
        line-height: var(--lh-tight);
        padding-bottom: 18px;
        border-bottom: 1px solid var(--ink);
        margin-bottom: 26px;
      }
      .co-field {
        margin-bottom: 22px;
      }
      .co-field label {
        display: block;
        font-family: var(--display);
        font-weight: var(--fw-medium);
        font-size: var(--fs-body-sm);
        letter-spacing: 0.02em;
        margin-bottom: 9px;
      }
      .co-field label .req {
        color: var(--crimson);
      }
      .co-field input,
      .co-field textarea {
        width: 100%;
        font-family: var(--body);
        font-size: var(--fs-body-md);
        color: var(--ink);
        background: transparent;
        border: 1.5px solid var(--line);
        border-radius: var(--r-card);
        padding: 13px 15px;
        transition:
          border-color 0.2s var(--ease),
          background 0.2s var(--ease);
      }
      .co-field textarea {
        resize: vertical;
        min-height: 92px;
        line-height: var(--lh-body);
      }
      .co-field input:focus,
      .co-field textarea:focus {
        outline: none;
        border-color: var(--crimson);
        background: color-mix(in srgb, var(--cream-100) 50%, transparent);
      }
      .co-field input::placeholder,
      .co-field textarea::placeholder {
        color: color-mix(in srgb, var(--ink) 38%, transparent);
      }

      .co-error {
        background: color-mix(in srgb, var(--crimson) 10%, transparent);
        border: 1px solid color-mix(in srgb, var(--crimson) 40%, transparent);
        color: var(--crimson-deep);
        font-size: var(--fs-body-sm);
        line-height: var(--lh-body);
        border-radius: var(--r-card);
        padding: 12px 16px;
        margin-bottom: 20px;
      }
      .co-pay-note {
        font-size: var(--fs-body-sm);
        line-height: var(--lh-body);
        color: color-mix(in srgb, var(--ink) 60%, transparent);
        margin-top: 16px;
      }
      #co-submit[disabled] {
        opacity: 0.55;
        pointer-events: none;
      }

      /* SUMMARY */
      .co-sum {
        position: sticky;
        top: calc(var(--nav-h) + 20px);
        background: var(--cream-100);
        border-radius: var(--r-craft);
        padding: clamp(24px, 3vw, 36px);
      }
      .co-line {
        display: grid;
        grid-template-columns: 56px 1fr auto;
        gap: 14px;
        align-items: center;
        padding: 16px 0;
        border-bottom: 1px solid var(--line);
      }
      .co-line:first-child {
        padding-top: 0;
      }
      .co-line__media {
        width: 56px;
        height: 56px;
        border-radius: var(--r-card);
        overflow: hidden;
        background: var(--cream-50);
      }
      .co-line__media img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .co-line__media .ph {
        width: 100%;
        height: 100%;
      }
      .co-line__name {
        font-family: var(--display);
        font-weight: var(--fw-semibold);
        font-size: var(--fs-body-md);
        line-height: 1.25;
      }
      .co-line__meta {
        font-size: var(--fs-body-xs);
        color: color-mix(in srgb, var(--ink) 58%, transparent);
        margin-top: 4px;
      }
      .co-line__price {
        font-family: var(--display);
        font-weight: var(--fw-semibold);
        font-size: var(--fs-body-sm);
        white-space: nowrap;
      }
      .co-total {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin-top: 22px;
        font-family: var(--display);
        font-weight: var(--fw-bold);
        font-size: var(--fs-h3);
        letter-spacing: var(--ls-display-sm);
      }
      .co-total__val {
        color: var(--crimson);
      }
      .co-ship-note {
        font-size: var(--fs-body-sm);
        color: color-mix(in srgb, var(--ink) 58%, transparent);
        margin-top: 10px;
      }

      @media (max-width: 860px) {
        .co-grid {
          grid-template-columns: 1fr;
          gap: 40px;
        }
        .co-sum {
          position: static;
          order: -1;
        }
      }
    </style>
  
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-G7TTFHPV8P"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-G7TTFHPV8P');
    </script>
</head>

  <body>
    <site-header active=""></site-header>

    <main class="wrap co">
      <nav
        class="breadcrumb reveal"
        style="
          display: flex;
          gap: 10px;
          align-items: center;
          font-family: var(--display);
          font-weight: 500;
          font-size: 0.85rem;
          color: color-mix(in srgb, var(--ink) 55%, transparent);
          margin-bottom: 8px;
        "
      >
        <a href="catalogue.html" style="transition: color 0.25s">Bộ sưu tập</a>
        <span style="opacity: 0.4">/</span>
        <span style="color: var(--ink)">Thanh toán</span>
      </nav>

      <div class="co-head reveal">
        <p class="eyebrow">Bước cuối</p>
        <h1 class="co-title">Hoàn tất đơn hàng.</h1>
      </div>

      <div class="co-grid">
        <!-- FORM -->
        <form id="co-form" class="reveal" novalidate>
          <h2 class="co-form__h">Thông tin nhận hàng</h2>

          <div class="co-error" id="co-error" hidden></div>

          <div class="co-field">
            <label for="co-name">Họ và tên <span class="req">*</span></label>
            <input
              id="co-name"
              name="name"
              type="text"
              required
              autocomplete="name"
              placeholder="Nguyễn Văn A"
            />
          </div>
          <div class="co-field">
            <label for="co-email">Email <span class="req">*</span></label>
            <input
              id="co-email"
              name="email"
              type="email"
              required
              autocomplete="email"
              placeholder="ban@email.com"
            />
          </div>
          <div class="co-field">
            <label for="co-phone"
              >Số điện thoại <span class="req">*</span></label
            >
            <input
              id="co-phone"
              name="phone"
              type="tel"
              required
              autocomplete="tel"
              placeholder="09xx xxx xxx"
            />
          </div>
          <div class="co-field">
            <label for="co-address"
              >Địa chỉ nhận hàng <span class="req">*</span></label
            >
            <textarea
              id="co-address"
              name="address"
              required
              autocomplete="street-address"
              placeholder="Số nhà, đường, phường/xã, quận/huyện, tỉnh/thành"
            ></textarea>
          </div>

          <button
            type="submit"
            id="co-submit"
            class="circle-btn circle-btn--solid circle-btn--block"
          >
            Đặt hàng & thanh toán
          </button>
          <p class="co-pay-note">
            Bạn sẽ được chuyển sang cổng MoMo để thanh toán an toàn. Xác nhận đơn
            gửi qua email sau khi thanh toán thành công.
          </p>
        </form>

        <!-- SUMMARY -->
        <aside class="co-sum reveal" data-delay="100">
          <h2 class="co-sum__h">Đơn của bạn</h2>
          <div id="co-summary"></div>
        </aside>
      </div>
    </main>

    <site-footer></site-footer>

    <!-- CART DRAWER -->
    <div class="cart-scrim" data-cart-scrim></div>
    <aside class="cart-drawer" data-cart-drawer aria-label="Giỏ hàng">
      <div class="cart-drawer__head">
        <span class="cart-drawer__title">Giỏ hàng</span>
        <button class="cart-close" data-close-cart aria-label="Đóng">✕</button>
      </div>
      <div class="cart-items" data-cart-items></div>
      <div class="cart-drawer__foot">
        <div class="cart-total">
          <span class="cart-total__label">Tạm tính</span>
          <span class="cart-total__val" data-cart-total>0₫</span>
        </div>
        <button class="circle-btn circle-btn--solid circle-btn--block">
          Thanh toán
        </button>
      </div>
    </aside>

    <script src="/components/site-header.js" defer></script>
    <script src="/components/site-footer.js" defer></script>
    <script src="/js/api.js" defer></script>
    <script src="/js/checkout.js" defer></script>
    <script src="/js/artdict.js" defer></script>
  </body>
</html>
